<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171B20">
<meta name="description" content="تدريب النطق لعرض Crime Doesn't Pay — اسمع كل جملة، قلها، والموقع يصحح لك.">
<title>Crime Doesn't Pay — تدريب النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#171B20;--dark2:#262C33;--yellow:#FFC72C;--cyan:#1FA9D6;--cyan-dk:#0B6E91;--red:#E23D3D;--green:#1F9D61;--bg:#F1F3F5;--card:#fff;--ink:#0F1215;--muted:#6B7580;--line:#E2E6EA;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.en{font-family:Inter,system-ui,sans-serif;direction:ltr;text-align:left}
.display{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.5px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
.bar{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.bar a.back{flex:none;width:42px;height:42px;border-radius:12px;background:var(--dark2);display:grid;place-items:center;color:#fff;text-decoration:none;font-size:22px}
.bar .t{font-family:Anton,Impact,sans-serif;font-size:20px;direction:ltr;line-height:1;text-align:right}
.bar .t span{color:var(--cyan)}
.bar .s{font-size:12px;color:#c9d0d7;margin-top:3px}
.tape{background:var(--yellow);color:#111;font-family:Anton,Impact,sans-serif;font-size:11px;letter-spacing:2.5px;text-align:center;padding:4px 0;direction:ltr;white-space:nowrap;overflow:hidden}
.hero{background:var(--dark);color:#fff;border-radius:var(--r);padding:16px;margin-top:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(23,27,32,.25)}
.marker{flex:none;width:54px;height:62px;background:var(--yellow);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);display:grid;place-items:end center;color:#111;font-family:Anton,Impact,sans-serif;font-size:28px;padding-bottom:3px}
.marker.sm{width:40px;height:46px;font-size:20px;padding-bottom:2px}
.hero .who{flex:1;min-width:0}
.hero .name{font-family:Anton,Impact,sans-serif;font-size:30px;direction:ltr;text-align:right;line-height:1}
.hero .arname{color:#d5dbe1;font-size:15px;margin-top:2px}
.hero .role{font-size:13px;color:#c9d0d7;margin-top:6px;line-height:1.6}
.hero .role b{color:var(--yellow)}
.prog{margin-top:10px;height:8px;background:#2e353d;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--yellow);border-radius:99px;transition:width .5s}
.progt{font-size:12px;color:#c9d0d7;margin-top:5px}
.tabs{position:sticky;top:62px;z-index:15;display:flex;gap:6px;background:var(--bg);padding:10px 0 8px}
.tab{flex:1;min-width:0;border:0;background:#fff;border-radius:12px;padding:10px 2px;font-weight:800;font-size:13px;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.06);white-space:nowrap}
.tab.on{background:var(--dark);color:#fff}
.tab .c{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--yellow);color:#111;font-size:11px;margin-inline-start:3px}
h2.sec{font-size:15px;margin:16px 2px 2px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow);flex:none}
h2.sec .en{color:var(--muted);font-weight:600;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:4px 2px 0;line-height:1.7}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);position:relative;overflow:hidden;transition:box-shadow .2s}
.card.focus{box-shadow:0 0 0 3px var(--yellow),0 6px 20px rgba(0,0,0,.1)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:14px;color:#111}
.done{margin-inline-start:auto;font-size:12px;color:var(--green);font-weight:800;background:#DFF5E8;border-radius:99px;padding:2px 10px}
.qrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;background:var(--bg);border-radius:12px;padding:8px 10px}
.qrow .qplay{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:var(--dark);color:#fff;font-size:14px}
.qrow .q{font-family:Inter,system-ui,sans-serif;direction:ltr;text-align:left;font-weight:700;font-size:15px;color:var(--cyan-dk);flex:1}
.qlab{font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.qar{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.line{font-family:Inter,system-ui,sans-serif;direction:ltr;text-align:left;font-size:21px;line-height:1.6;font-weight:600;color:var(--ink);word-spacing:1px}
.line .w{display:inline-block;border-radius:6px;padding:0 3px;margin:0 -1px;cursor:pointer;transition:background .15s,color .15s}
.line .w.now{background:var(--yellow);color:#111}
.line .w.ok{background:#DFF5E8;color:#0F6B40}
.line .w.close{background:#FFF1C2;color:#7A5A00}
.line .w.miss{background:#FFE0E0;color:#A51D1D;text-decoration:underline wavy #E23D3D;text-underline-offset:3px}
.ar{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.7}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:12px;padding:12px 6px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);color:var(--ink);min-height:46px}
.btn:active{transform:scale(.97)}
.btn.mic{background:var(--dark);color:#fff;flex:1.5}
.btn.mic.rec{background:var(--red);animation:pulse 1.1s infinite}
.btn.next{background:var(--green);color:#fff}
.btn.again{background:var(--bg)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,61,61,.55)}60%{box-shadow:0 0 0 12px rgba(226,61,61,0)}}
.live{direction:ltr;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--muted);margin-top:8px;min-height:20px;line-height:1.5}
.res{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.score{display:flex;align-items:center;gap:12px}
.pct{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:22px;color:#fff;background:var(--muted)}
.pct.g{background:var(--green)}.pct.y{background:#E0A300}.pct.r{background:var(--red)}
.msg{font-weight:800;font-size:15px;line-height:1.5}
.heard{font-family:Inter,system-ui,sans-serif;direction:ltr;text-align:left;font-size:13px;color:var(--muted);margin-top:4px}
.heard b{font-family:Cairo,sans-serif;font-weight:700;direction:rtl}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;direction:ltr}
.chip{border:0;background:#FFF1C2;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;gap:7px;align-items:center;color:#111}
.chip.miss{background:#FFE0E0}
.chip .en{font-weight:700}
.chip .say{font-family:Cairo,sans-serif;font-size:12px;color:var(--cyan-dk);direction:rtl}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:3px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wcard{background:#fff;border:0;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);display:block;width:100%}
.wcard .en{font-weight:700;font-size:17px;text-align:center}
.wcard .say{color:var(--cyan-dk);font-weight:800;margin-top:4px;font-size:15px}
.wcard .m{color:var(--muted);font-size:13px;margin-top:2px}
.wcard .spk{font-size:12px;color:var(--muted);margin-top:4px}
.home-hero{background:var(--dark);color:#fff;border-radius:var(--r);padding:22px 18px 20px;margin-top:14px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(23,27,32,.25)}
.home-hero .k{color:var(--yellow);font-size:11px;letter-spacing:3px;font-weight:800;direction:ltr;text-align:right;font-family:Inter,sans-serif}
.home-hero h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:44px;line-height:1;margin:6px 0 0;direction:ltr;text-align:right}
.home-hero h1 span{color:var(--cyan)}
.home-hero p{margin:10px 0 0;color:#d5dbe1;font-size:15px;line-height:1.7}
.mem{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:12px 14px;margin-top:10px;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.mem:active{transform:scale(.99)}
.mem .who{flex:1;min-width:0}
.mem .name{font-family:Anton,Impact,sans-serif;font-size:22px;direction:ltr;text-align:right;line-height:1.05}
.mem .name small{font-family:Cairo,sans-serif;font-size:14px;color:var(--muted);margin-right:8px}
.mem .sub{font-size:13px;color:var(--muted);margin-top:3px}
.mem .pr{height:5px;background:var(--bg);border-radius:99px;margin-top:7px;overflow:hidden}
.mem .pr i{display:block;height:100%;background:var(--green);border-radius:99px}
.mem .go{color:var(--muted);font-size:24px;flex:none}
.note{background:#FFF7DB;border:1.5px solid var(--yellow);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.8}
.note.warn{background:#FFE9E9;border-color:var(--red)}
.note .btn{margin-top:8px;flex:none;width:100%}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.8}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:50;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3);line-height:1.6;text-align:center}
.conf{position:absolute;font-size:22px;pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-120px) scale(1.2);opacity:0}}
.panel[hidden]{display:none}
</style>

<script>/* Pronunciation scoring: aligns what the phone heard against the target sentence,
   word by word, and marks each target word ok / close / miss.
   Plain JS — inlined into the site and also required by the node tests. */
var Scoring = (function () {
  var EXPANSIONS = {
    doesnt: ["does", "not"], dont: ["do", "not"], its: ["it", "is"], lets: ["let", "us"],
    cant: ["can", "not"], cannot: ["can", "not"], well: ["we", "will"], im: ["i", "am"], thats: ["that", "is"],
    theres: ["there", "is"], youre: ["you", "are"], theyre: ["they", "are"], isnt: ["is", "not"],
    arent: ["are", "not"], wont: ["will", "not"], didnt: ["did", "not"], wasnt: ["was", "not"],
    "1930s": ["nineteen", "thirties"], "1940s": ["nineteen", "forties"],
    "1935": ["nineteen", "thirty", "five"], "1947": ["nineteen", "forty", "seven"],
    "1877": ["eighteen", "seventy", "seven"], "1966": ["nineteen", "sixty", "six"],
    mr: ["mister"], dr: ["doctor"], ok: ["okay"], cctv: ["cc", "tv"], dna: ["d", "n", "a"]
  };
  // words where any rough attempt counts (names, foreign words)
  var LENIENT = { hisham: 1, orabi: 1, majed: 1, fares: 1, hassam: 1, khalid: 1, reda: 1, locard: 1, edmond: 1,
    kollona: 1, amn: 1, bakhsh: 1, harbi: 1, osama: 1, hattar: 1, nabhan: 1, al: 1, interpol: 1, britannica: 1, cambridge: 1 };

  function key(word) {
    var k = String(word).toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9']+/g, "");
    return k.replace(/'/g, "");
  }
  // one display token can carry several keys: "(1935–1947)" -> 1935, 1947 ; "Al-Harbi" -> al, harbi
  function keysOf(token) {
    return String(token).split(/[–—\-\/]+/).map(key).filter(Boolean);
  }
  function tokenize(text) {
    return String(text).split(/\s+/).filter(function (t) { return keysOf(t).length; });
  }
  function heardKeys(transcript, targetKeys) {
    var toks = String(transcript).split(/\s+/).map(key).filter(Boolean);
    var want = {};
    targetKeys.forEach(function (k) { if (EXPANSIONS[k]) want[k] = EXPANSIONS[k]; });
    var set = {};
    targetKeys.forEach(function (k) { set[k] = 1; });
    var out = [];
    for (var i = 0; i < toks.length; i++) {
      var merged = false;
      // "short cut" -> shortcut, "cyber crime" -> cybercrime
      for (var L = 3; L >= 2 && !merged; L--) {
        if (i + L <= toks.length && set[toks.slice(i, i + L).join("")] && !set[toks[i]]) { out.push(toks.slice(i, i + L).join("")); i += L - 1; merged = true; }
      }
      if (merged) continue;
      for (var c in want) {
        var exp = want[c], ok = exp.length <= toks.length - i;
        for (var j = 0; ok && j < exp.length; j++) if (toks[i + j] !== exp[j]) ok = false;
        if (ok) { out.push(c); i += exp.length - 1; merged = true; break; }
      }
      if (!merged) out.push(toks[i]);
    }
    return out;
  }
  function lev(a, b) {
    var m = a.length, n = b.length, prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function sim(a, b) {
    if (a === b) return 1;
    var L = Math.max(a.length, b.length);
    return L ? 1 - lev(a, b) / L : 0;
  }
  function skeleton(k) { // rough sound shape: used to forgive vowel mistakes
    return k.replace(/ph/g, "f").replace(/ck/g, "k").replace(/c(?=[aou])/g, "k").replace(/c(?=[eiy])/g, "s")
      .replace(/qu/g, "kw").replace(/(.)\1/g, "$1").replace(/[aeiouyh]/g, "");
  }
  // 2 = exact, 1 = close, -1 = different
  function match(t, h) {
    if (t === h) return 2;
    if (LENIENT[t]) return (h.indexOf(t) >= 0 || t.indexOf(h) >= 0 || sim(t, h) >= 0.5) ? 2 : -1;
    var s = sim(t, h);
    if (s >= 0.85) return 2;
    if (s >= 0.67) return 1;
    var a = skeleton(t), b = skeleton(h);
    if (a.length >= 2 && a === b && Math.abs(t.length - h.length) <= 2) return 1;
    return -1;
  }
  // Needleman–Wunsch alignment; returns status per target key
  function align(T, H) {
    var n = T.length, m = H.length, GAP = -1, i, j;
    var S = [], B = [];
    for (i = 0; i <= n; i++) { S[i] = [i * GAP]; B[i] = [i ? "u" : ""]; }
    for (j = 1; j <= m; j++) { S[0][j] = j * GAP; B[0][j] = "l"; }
    for (i = 1; i <= n; i++) for (j = 1; j <= m; j++) {
      var d = S[i - 1][j - 1] + match(T[i - 1], H[j - 1]), u = S[i - 1][j] + GAP, l = S[i][j - 1] + GAP;
      if (d >= u && d >= l) { S[i][j] = d; B[i][j] = "d"; }
      else if (u >= l) { S[i][j] = u; B[i][j] = "u"; }
      else { S[i][j] = l; B[i][j] = "l"; }
    }
    var status = new Array(n), heard = new Array(n);
    i = n; j = m;
    while (i > 0 || j > 0) {
      var b = B[i][j];
      if (b === "d") { var q = match(T[i - 1], H[j - 1]); status[i - 1] = q === 2 ? "ok" : q === 1 ? "close" : "miss"; heard[i - 1] = H[j - 1]; i--; j--; }
      else if (b === "u") { status[i - 1] = "miss"; i--; }
      else { j--; }
    }
    return { status: status, heard: heard };
  }
  var WEIGHT = { ok: 1, close: 0.6, miss: 0 };
  function score(target, transcript) {
    var tokens = tokenize(target);
    var keys = [], owner = [];
    tokens.forEach(function (t, ti) { keysOf(t).forEach(function (k) { keys.push(k); owner.push(ti); }); });
    var H = heardKeys(transcript, keys);
    var al = align(keys, H);
    var words = tokens.map(function (t) { return { text: t, status: "ok", keys: [] }; });
    al.status.forEach(function (st, ki) {
      var w = words[owner[ki]];
      w.keys.push(keys[ki]);
      if (st === "miss") w.status = "miss"; else if (st === "close" && w.status !== "miss") w.status = "close";
    });
    var total = 0;
    al.status.forEach(function (st) { total += WEIGHT[st]; });
    var pct = keys.length ? Math.round(100 * total / keys.length) : 0;
    return { percent: pct, words: words, heard: H.join(" ") };
  }
  function best(target, alternatives) {
    var r = null;
    (alternatives.length ? alternatives : [""]).forEach(function (t) {
      var s = score(target, t);
      if (!r || s.percent > r.percent) r = s;
    });
    return r;
  }
  // Has the speaker reached the END of the sentence? true when one of the last two target words
  // was heard (ok/close) — used to decide when to stop listening, never to grade.
  function reachedEnd(target, transcript) {
    var keys = [];
    tokenize(target).forEach(function (t) { keysOf(t).forEach(function (k) { keys.push(k); }); });
    if (!keys.length) return true;
    var H = heardKeys(transcript, keys);
    if (!H.length) return false;
    var st = align(keys, H).status, n = keys.length;
    for (var i = Math.max(0, n - 2); i < n; i++) if (st[i] === "ok" || st[i] === "close") return true;
    return false;
  }
  // Phones (Android Chrome) often repeat earlier text inside later results; join without doubling.
  function joinParts(parts) {
    var acc = "";
    parts.forEach(function (p) {
      var t = String(p || "").replace(/\s+/g, " ").trim();
      if (!t) return;
      var a = acc.toLowerCase(), b = t.toLowerCase();
      if (!acc) acc = t;
      else if (b.indexOf(a) === 0) acc = t;          // cumulative repeat: replace
      else if (a.slice(-b.length) === b) return;     // exact tail repeat: skip
      else acc += " " + t;
    });
    return acc;
  }
  return { key: key, keysOf: keysOf, tokenize: tokenize, score: score, best: best, sim: sim, reachedEnd: reachedEnd, joinParts: joinParts };
})();
if (typeof module !== "undefined") module.exports = Scoring;

const DATA = {"teacher":{"en":"Mr. Hisham Al-Orabi","ar":"الأستاذ هشام العرابي"},"members":[{"id":"hassam","en":"Hassam","last":"Bakhsh","ar":"حسام","arFull":"حسام بخش","slides":[1,2],"time":"دقيقة ونص تقريباً","preparer":true},{"id":"fares","en":"Fares","last":"Osama","ar":"فارس","arFull":"فارس أسامة","slides":[3,4],"time":"دقيقتين تقريباً"},{"id":"majed","en":"Majed","last":"Al-Harbi","ar":"ماجد","arFull":"ماجد الحربي","slides":[5],"time":"دقيقة تقريباً"},{"id":"khalid","en":"Khalid","last":"Al-Hattar","ar":"خالد","arFull":"خالد الهتار","slides":[6,7],"time":"دقيقتين تقريباً"},{"id":"reda","en":"Reda","last":"Nabhan","ar":"رضا","arFull":"رضا نبهان","slides":[8,9,10],"time":"دقيقة ونص تقريباً"}],"slides":{"1":{"title":"Crime Doesn't Pay (Title)","ar":"شريحة العنوان والمقدمة","lines":[["Good morning, Mr. Hisham, and good morning, everyone.","صباح الخير أستاذ هشام، وصباح الخير للجميع."],["Our project is about the unit \"Crime Doesn't Pay\".","مشروعنا عن وحدة \"الجريمة لا تفيد\"."],["Today we will explain what this saying means, the types of crime, and why people commit crimes.","اليوم بنشرح معنى هذه العبارة، وأنواع الجرائم، ولماذا يرتكب الناس الجرائم."],["We will also talk about the price of crime, how criminals get caught, and how we can stop crime.","وبنتكلم أيضاً عن ثمن الجريمة، وكيف يُقبض على المجرمين، وكيف نقدر نوقف الجريمة."],["Let's start.","خلّونا نبدأ."]]},"2":{"title":"What Does It Mean?","ar":"معنى العبارة","lines":[["First, what does \"crime doesn't pay\" mean?","أولاً، ما معنى \"الجريمة لا تفيد\"؟"],["It means that breaking the law never brings a real benefit.","معناها أن مخالفة القانون لا تجلب فائدة حقيقية أبداً."],["A criminal may get money for a short time, but the price he pays later is always bigger.","المجرم ممكن يحصل على فلوس لفترة قصيرة، لكن الثمن الذي يدفعه بعدها دائماً أكبر."],["This saying became famous in the 1930s and 1940s.","هذه العبارة اشتهرت في الثلاثينات والأربعينات."],["There was an American film series called \"Crime Does Not Pay\", and in every film the criminal was caught at the end.","كانت هناك سلسلة أفلام أمريكية اسمها \"Crime Does Not Pay\"، وفي كل فيلم يُقبض على المجرم في النهاية."],["Here are some key words: crime, criminal, victim, law, punishment and justice.","وهذه كلمات مهمة: جريمة، مجرم، ضحية، قانون، عقوبة، عدالة."],["Now Fares will tell you about the types of crime.","الحين فارس بيكلمكم عن أنواع الجرائم."]]},"3":{"title":"Types of Crime","ar":"أنواع الجرائم","lines":[["Thank you, Hassam. There are many types of crime.","شكراً حسام. هناك أنواع كثيرة من الجرائم."],["Theft means taking someone's money or things without permission.","السرقة: أخذ فلوس أو أغراض شخص بدون إذنه."],["Fraud means lying to people or tricking them to take their money.","الاحتيال: الكذب على الناس أو خداعهم لأخذ فلوسهم."],["Cybercrime means using computers or phones to hack, cheat or steal data.","الجرائم الإلكترونية: استخدام الكمبيوتر أو الجوال للاختراق أو الغش أو سرقة البيانات."],["Vandalism means damaging public or private property on purpose.","التخريب: إتلاف الممتلكات العامة أو الخاصة عن قصد."],["Drug crimes mean selling, carrying or using illegal drugs.","جرائم المخدرات: بيع أو حمل أو تعاطي المخدرات."],["And violent crime means attacking or hurting other people.","وجرائم العنف: الاعتداء على الناس أو إيذاؤهم."]]},"4":{"title":"Why People Turn to Crime","ar":"أسباب الجريمة","lines":[["So, why do people commit crimes?","طيب، لماذا يرتكب الناس الجرائم؟"],["The first reason is greed. Some people want easy money, fast.","السبب الأول الطمع. بعض الناس يريدون فلوساً سهلة وبسرعة."],["The second reason is bad friends. They can push you to break the rules.","السبب الثاني رفقاء السوء. ممكن يدفعونك لمخالفة القوانين."],["Poverty is another reason. Having no job or money can lead to wrong choices.","الفقر سبب آخر. عدم وجود وظيفة أو فلوس ممكن يقود لاختيارات خاطئة."],["Drugs are also a reason. Addiction makes people steal to buy more.","المخدرات أيضاً سبب. الإدمان يجعل الناس يسرقون ليشتروا أكثر."],["And some people grow up with no guidance from their family or school.","وبعض الناس يكبرون بدون توجيه من أهلهم أو مدرستهم."],["But remember: a reason is never an excuse. Every crime is a choice.","لكن تذكّروا: السبب ليس عذراً أبداً. كل جريمة اختيار."],["Now Majed will show you the price of crime.","الحين ماجد بيوريكم ثمن الجريمة."]]},"5":{"title":"The Price of Crime","ar":"ثمن الجريمة (الفاتورة)","lines":[["Thank you, Fares. Look at this receipt. This is the bill for crime.","شكراً فارس. انظروا لهذه الفاتورة. هذه فاتورة الجريمة."],["Criminals think crime is a shortcut to easy money, but in the end, the criminal always pays.","المجرمون يظنون الجريمة طريقاً مختصراً للفلوس السهلة، لكن في النهاية المجرم هو الذي يدفع دائماً."],["Prison time costs him his freedom.","السجن يكلّفه حريته."],["Heavy fines cost him his money.","الغرامات الكبيرة تكلّفه فلوسه."],["A criminal record costs him his future, because it is hard to find a job.","السجل الجنائي يكلّفه مستقبله، لأنه يصعب عليه أن يجد وظيفة."],["Family shame costs him the trust of his family.","فضيحة العائلة تكلّفه ثقة أهله."],["And guilt and fear cost him his peace of mind.","والشعور بالذنب والخوف يكلّفانه راحة باله."],["The total is his whole life, paid in full. That is why we say: crime doesn't pay.","المجموع هو حياته كلها، مدفوعة بالكامل. لهذا نقول: الجريمة لا تفيد."],["Now Khalid will talk about the victims.","الحين خالد بيتكلم عن الضحايا."]]},"6":{"title":"Victims and Society Pay Too","ar":"الضحايا والمجتمع يدفعون الثمن","lines":[["Thank you, Majed. Crime does not only hurt the criminal.","شكراً ماجد. الجريمة لا تضر المجرم فقط."],["Victims lose their money and property. They can get hurt, and they stop feeling safe, even at home.","الضحايا يخسرون فلوسهم وممتلكاتهم، وممكن يتأذون، ويفقدون إحساسهم بالأمان حتى في بيوتهم."],["Families live with worry, stress, shame and sadness. They may lose income when a parent goes to prison.","العائلات تعيش في قلق وضغط وحزن، وممكن تخسر دخلها إذا دخل الأب أو الأم السجن."],["Society pays too. Streets become less safe, and a lot of money goes to police, courts and prisons.","والمجتمع يدفع أيضاً. الشوارع تصبح أقل أماناً، وتُصرف فلوس كثيرة على الشرطة والمحاكم والسجون."],["And people lose trust in each other.","والناس يفقدون الثقة في بعضهم."],["So one person commits the crime, but many people pay the price.","يعني شخص واحد يرتكب الجريمة، لكن ناس كثيرين يدفعون الثمن."]]},"7":{"title":"Crime Always Leaves Traces","ar":"الجريمة تترك أثراً دائماً","lines":[["Many criminals think they will never be caught. But crime always leaves traces.","كثير من المجرمين يظنون أنهم لن يُقبض عليهم أبداً. لكن الجريمة دائماً تترك أثراً."],["Dr. Edmond Locard was a pioneer of forensic science. He said: \"Every contact leaves a trace.\"","الدكتور إدموند لوكار من رواد علم الأدلة الجنائية، وقال: \"كل تلامس يترك أثراً\"."],["Today, the police use fingerprints, because every fingerprint is unique.","اليوم الشرطة تستخدم البصمات، لأن كل بصمة مختلفة عن الأخرى."],["They use DNA. Even one hair can identify a person.","ويستخدمون الحمض النووي DNA. حتى شعرة واحدة تقدر تحدد هوية الشخص."],["They also use CCTV cameras, phone and internet records, and bank records.","ويستخدمون أيضاً كاميرات المراقبة، وسجلات الجوال والإنترنت، والسجلات البنكية."],["And of course, witnesses: people who saw the crime.","وطبعاً الشهود: الناس الذين شاهدوا الجريمة."],["So sooner or later, the criminal gets caught. Now Reda will tell you how we can stop crime.","يعني عاجلاً أو آجلاً يُقبض على المجرم. الحين رضا بيقول لكم كيف نوقف الجريمة."]]},"8":{"title":"Stop Crime Before It Starts","ar":"منع الجريمة + الخلاصة","lines":[["Thank you, Khalid. How can we stop crime before it starts?","شكراً خالد. كيف نوقف الجريمة قبل أن تبدأ؟"],["First, the family. Parents should teach their children right from wrong.","أولاً الأسرة. الأهل لازم يعلّمون أبناءهم الصح من الغلط."],["Second, the school. Lessons can explain the law and why it matters.","ثانياً المدرسة. الدروس تقدر تشرح القانون ولماذا هو مهم."],["Third, friends. Choose friends who keep you on the right path.","ثالثاً الأصدقاء. اختر أصدقاء يبقونك على الطريق الصحيح."],["And fourth, report it. Tell the police. In Saudi Arabia, you can use the Kollona Amn app.","ورابعاً بلّغ. أخبر الشرطة. في السعودية تقدر تستخدم تطبيق \"كلنا أمن\"."],["Our verdict is: crime may look easy, but its price is always higher. Crime doesn't pay, so choose the right path.","حكمنا النهائي: الجريمة قد تبدو سهلة، لكن ثمنها دائماً أكبر. الجريمة لا تفيد، فاختر الطريق الصحيح."]]},"9":{"title":"The Investigation Team","ar":"أعضاء المجموعة","lines":[["This is our team: Majed Al-Harbi, Fares Osama, Hassam Bakhsh, who prepared this presentation, Khalid Al-Hattar, and me, Reda Nabhan.","هذا فريقنا: ماجد الحربي، فارس أسامة، حسام بخش اللي أعدّ هذا العرض، خالد الهتار، وأنا رضا نبهان."]]},"10":{"title":"References","ar":"المراجع والختام","lines":[["These are the sources we used in our research, like the Cambridge Dictionary, Britannica and INTERPOL.","هذه المصادر التي استخدمناها في بحثنا، مثل قاموس كامبريدج وبريتانيكا والإنتربول."],["Thank you for listening. Do you have any questions?","شكراً لاستماعكم. هل عندكم أي أسئلة؟"]]}},"words":{"hassam":[["benefit","بِنِفِت","فائدة"],["criminal","كرِمِنَل","مجرم"],["victim","ڤِكْتِم","ضحية"],["punishment","بَنِشْمِنْت","عقوبة"],["justice","جَسْتِس","عدالة"],["series","سِيريز","سلسلة"]],"fares":[["theft","ثِفْت","سرقة"],["fraud","فْرُود","احتيال"],["vandalism","ڤانْدَلِزَم","تخريب"],["property","پْرُوپَرْتي","ممتلكات"],["illegal","إلّيقَل","غير قانوني"],["greed","قْرِيد","طمع"],["poverty","پُوڤَرْتي","فقر"],["addiction","أدِكْشِن","إدمان"],["guidance","قايْدَنْس","توجيه"],["excuse","إكْسْكيوس","عذر"]],"majed":[["receipt","رِسِيت (الـ p ما تنقال)","فاتورة / إيصال"],["shortcut","شورْتْكَت","طريق مختصر"],["freedom","فْرِيدَم","حرية"],["fines","فاينز","غرامات"],["criminal record","كرِمِنَل رِكورْد","سجل جنائي"],["shame","شيم","فضيحة / عار"],["guilt","قِلْت (الـ u ما تنقال)","شعور بالذنب"],["peace of mind","پِيس أوف مايْنْد","راحة البال"]],"khalid":[["property","پْرُوپَرْتي","ممتلكات"],["income","إنْكَم","دخل"],["society","سَسايَتي","المجتمع"],["courts","كورْتْس","محاكم"],["traces","تْرِيسِز","آثار"],["forensic","فَرِنْزِك","جنائي / أدلة جنائية"],["pioneer","پايَنِير","رائد"],["unique","يونِيك","فريد / ما يتكرر"],["identify","آيْدِنْتِفاي","يحدد هوية"],["witnesses","وِتْنِسِز","شهود"]],"reda":[["parents","پيرِنْتْس","الوالدين / الأهل"],["path","پاث","طريق"],["report","رِپورْت","يبلّغ"],["verdict","ڤِرْدِكْت","حكم نهائي"],["sources","سورْسِز","مصادر"],["research","رِسِرْچ","بحث"],["prepared","پْرِيپيرْد","أعدّ / جهّز"],["INTERPOL","إنْتَرْپول","الشرطة الدولية"],["Kollona Amn","كلّنا أمن","تطبيق للتبليغ"]]},"qa":{"hassam":[["What does \"crime doesn't pay\" mean?","It means that crime never brings a real benefit. The criminal always pays a bigger price.","يعني الجريمة لا تجلب فائدة حقيقية، والمجرم دائماً يدفع ثمناً أكبر."],["Where did this saying come from?","It became famous in the 1930s and 1940s from an American film series called \"Crime Does Not Pay\".","اشتهرت في الثلاثينات والأربعينات من سلسلة أفلام أمريكية."]],"fares":[["Name three types of crime.","Theft, fraud and cybercrime.","السرقة، الاحتيال، الجرائم الإلكترونية."],["Why do people commit crimes?","Because of greed, bad friends, poverty, drugs and no guidance. But every crime is a choice.","بسبب الطمع ورفقاء السوء والفقر والمخدرات وقلة التوجيه، لكن كل جريمة اختيار."]],"majed":[["Why did you use a receipt?","To show that the criminal pays for his crime with his freedom, money, future, trust and peace of mind.","عشان نوضح إن المجرم يدفع ثمن جريمته من حريته وفلوسه ومستقبله وثقة أهله وراحة باله."],["What does a criminal lose?","He loses his freedom, his money, his future and the trust of his family.","يخسر حريته وفلوسه ومستقبله وثقة أهله."]],"khalid":[["Who pays the price of crime?","The victims, the families and the whole society.","الضحايا والعائلات والمجتمع كله."],["How do the police catch criminals?","They use fingerprints, DNA, CCTV cameras, phone records, bank records and witnesses.","بالبصمات والـDNA وكاميرات المراقبة وسجلات الجوال والبنك والشهود."]],"reda":[["How can we stop crime?","Families and schools teach good values, we choose good friends, and we report crime to the police.","الأسرة والمدرسة تعلّم القيم، نختار أصدقاء صالحين، ونبلّغ الشرطة."],["What is the main message of your project?","Crime may look easy, but its price is always higher. Crime doesn't pay.","الجريمة قد تبدو سهلة لكن ثمنها أكبر دائماً. الجريمة لا تفيد."]]},"summary":[["What is your project about?","عن ايش مشروعكم؟","Our project is about the saying \"Crime doesn't pay\". It means that crime never brings a real benefit.","مشروعنا عن عبارة \"الجريمة لا تفيد\"، ومعناها أن الجريمة لا تجلب فائدة حقيقية."],["Why do people commit crimes?","ليش الناس يسوون جرائم؟","People commit crimes because of greed, bad friends, poverty or drugs, but every crime is a choice.","الناس يرتكبون الجرائم بسبب الطمع أو رفقاء السوء أو الفقر أو المخدرات، لكن كل جريمة اختيار."],["What price does the criminal pay?","وش الثمن اللي يدفعه المجرم؟","The criminal always pays a big price: prison, fines and a lost future. Victims and society suffer too.","المجرم دائماً يدفع ثمناً كبيراً: السجن والغرامات وضياع المستقبل، والضحايا والمجتمع يتضررون أيضاً."],["How do the police catch criminals?","كيف الشرطة تمسك المجرمين؟","The police can catch criminals with fingerprints, DNA and cameras.","الشرطة تقدر تقبض على المجرمين بالبصمات والـDNA والكاميرات."],["How can we stop crime?","كيف نقدر نوقف الجريمة؟","We can stop crime with good families, good schools and good friends. Crime doesn't pay, so choose the right path.","نقدر نمنع الجريمة بالأسرة والمدرسة والأصدقاء الصالحين. الجريمة لا تفيد، فاختر الطريق الصحيح."]]};

  const ERR = { "not-allowed": "اسمح للموقع باستخدام المايك 🎤 (من إعدادات المتصفح)", "service-not-allowed": "اسمح للموقع باستخدام المايك 🎤", network: "التعرف على الصوت يحتاج إنترنت 📶", "audio-capture": "ما لقيت مايك في الجهاز" };
  if (st.error && ERR[st.error]) { live.textContent = ""; toast(ERR[st.error]); return; }
  if (!st.alts.length) { live.textContent = ""; toast("ما سمعت شي 👂 اضغط 🎤 وتكلم بصوت واضح وقريب من الجوال"); return; }
  const result = Scoring.best(st.item.en, st.alts);
  showResult(st.item, st.el, result);
}
function showResult(item, el, r) {
  const spans = el.querySelectorAll(".line .w");
  r.words.forEach((w, i) => { if (spans[i]) { spans[i].classList.remove("ok", "close", "miss", "now"); spans[i].classList.add(w.status); } });
  record(item.id, r.percent); refreshProgress();
  if (r.percent >= PASS) { const d = el.querySelector(".done"); if (d) d.hidden = false; }
  const res = el.querySelector(".res"); res.hidden = false;
  const cls = r.percent >= 90 ? "g" : r.percent >= PASS ? "y" : "r";
  const msg = r.percent >= 90 ? "ممتاز! 🔥 نطقك واضح" : r.percent >= PASS ? "زين جداً 👏 عيد الكلمات الصفراء والحمراء" : r.percent >= 50 ? "قريب! اسمع الجملة مرة ثانية وقلها ببطء 🐢" : "لا تستعجل 🙂 اسمع الجملة أول، بعدين قلها كلمة كلمة";
  const bad = r.words.map((w, i) => ({ ...w, i })).filter(w => w.status !== "ok");
  res.innerHTML = `<div class="score"><div class="pct ${cls}">${r.percent}%</div><div><div class="msg">${msg}</div><div class="heard"><b>سمعت منك:</b> ${esc(r.heard || "—")}</div></div></div>`
    + (bad.length ? `<div class="hint">كلمات تحتاج تدريب — اضغط الكلمة عشان تسمعها لحالها:</div><div class="chips">${bad.map(w => {
      const h = WORDHINT[Scoring.keysOf(w.text)[0]];
      return `<button class="chip ${w.status}" data-i="${w.i}"><span class="en">🔊 ${esc(w.text.replace(/[,.!?:;"()]+$/g, ""))}</span>${h ? `<span class="say">${esc(h.say)}</span>` : ""}</button>`;
    }).join("")}</div>` : `<div class="hint">كل الكلمات صح ✅</div>`)
    + `<div class="legend"><span><i style="background:#DFF5E8"></i>صح</span><span><i style="background:#FFF1C2"></i>قريب</span><span><i style="background:#FFE0E0"></i>غلط أو ناقص</span></div>`
    + `<div class="acts"><button class="btn again">🔁 جرّب مرة ثانية</button>${r.percent >= PASS ? `<button class="btn next">الجملة التالية ⬇</button>` : `<button class="btn next" data-slow="1">🐢 اسمعها ببطء</button>`}</div>`;
  if (r.percent >= 90) confetti(el);
  res.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function confetti(el) {
  const E = ["⭐", "🎉", "✨", "🏆", "👏"];
  for (let i = 0; i < 10; i++) { const s = document.createElement("span"); s.className = "conf"; s.textContent = E[i % E.length]; s.style.left = (8 + Math.random() * 84) + "%"; s.style.top = (30 + Math.random() * 50) + "%"; s.style.animationDelay = (Math.random() * .3) + "s"; el.appendChild(s); setTimeout(() => s.remove(), 1500); }
}
let toastT;
function toast(msg) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3800); }

// ---------- rendering ----------
const BAR = back => `<div class="bar">${back ? `<a class="back" href="#" aria-label="رجوع">›</a>` : ""}<div><div class="t">CRIME <span>DOESN'T PAY</span></div><div class="s">تدريب النطق · English Project</div></div></div><div class="tape">CRIME SCENE · DO NOT CROSS · CRIME DOESN'T PAY · CRIME SCENE · DO NOT CROSS · CRIME DOESN'T PAY · CRIME SCENE</div>`;
function cardHTML(item, idx) {
  const raw = item.en.split(/\s+/);
  const words = raw.map(t => Scoring.keysOf(t).length ? `<span class="w">${esc(t)}</span>` : `<span>${esc(t)}</span>`).join(" ");
  const done = bestOf(item.id) >= PASS;
  return `<div class="card" data-id="${item.id}">
    <div class="chead"><div class="num">${idx + 1}</div>${item.kind === "line" ? `<div class="hint">الشريحة ${item.slide}</div>` : ""}<div class="done" ${done ? "" : "hidden"}>✓ أتقنتها</div></div>
    ${item.q ? `<div class="qlab">🧑‍🏫 الأستاذ يسأل:</div><div class="qrow"><button class="qplay" data-q="${item.qid}" aria-label="اسمع السؤال">▶</button><div class="q">${esc(item.q)}</div></div>${item.qar ? `<div class="qar">${esc(item.qar)}</div>` : ""}<div class="qlab">🙋 جوابك:</div>` : ""}
    <div class="line">${words}</div>
    <div class="ar">${esc(item.ar)}</div>
    <div class="acts"><button class="btn play">▶ اسمع</button><button class="btn slow">🐢 ببطء</button><button class="btn mic">🎤 قلها</button></div>
    <div class="live"></div>
    <div class="res" hidden></div>
  </div>`;
}
function renderHome() {
  document.title = "Crime Doesn't Pay — تدريب النطق";
  app.innerHTML = BAR(false) + `<div class="wrap">
    <div class="home-hero"><div class="k">ENGLISH PROJECT · PRACTICE</div><h1>CRIME <span>DOESN'T PAY</span></h1><p>اسمع كل جملة، قلها بصوتك، والموقع يصحح لك. اختر اسمك 👇</p></div>
    ${DATA.members.map((m, i) => { const p = progressOf(m); return `<a class="mem" href="#${m.id}"><div class="marker sm">${i + 1}</div><div class="who"><div class="name">${esc((m.en + " " + m.last).toUpperCase())}<small>${esc(m.arFull)}</small></div><div class="sub">${slideList(m)} · ${m.preparer ? "★ معد التقرير · " : ""}أتقن ${p.done} من ${p.total}</div><div class="pr"><i style="width:${p.total ? Math.round(100 * p.done / p.total) : 0}%"></i></div></div><div class="go">‹</div></a>`; }).join("")}
    <div class="note">💡 يوم الأحد الأستاذ ممكن يختار <b>أي واحد</b> يشرح المشروع كله، فكل عضو يتدرب على قسم «الملخص» بعد جمله.</div>
    ${SR ? "" : `<div class="note warn">⚠️ التصحيح الصوتي ما يشتغل في هذا المتصفح. افتح الرابط في <b>Chrome</b> (أندرويد) أو <b>Safari</b> (آيفون). الاستماع يشتغل عادي.<button class="btn copy">📋 نسخ الرابط</button></div>`}
    <div class="foot">عرض مجموعة ${esc(DATA.members.find(m => m.preparer).arFull)} · ${esc(DATA.teacher.ar)}<br><span class="en">Powered by neural voices · scoring runs on your phone</span></div>
  </div>`;
}
function renderMember(m) {
  const idx = DATA.members.indexOf(m), before = DATA.members[idx - 1], after = DATA.members[idx + 1];
  const lines = lineItems(m), qa = qaItems(m), words = DATA.words[m.id] || [];
  document.title = `${m.en} — Crime Doesn't Pay`;
  const groups = m.slides.map(n => ({ n, title: DATA.slides[n].title.replace(" (Title)", ""), ar: DATA.slides[n].ar, items: lines.filter(i => i.slide === n) }));
  let k = 0;
  app.innerHTML = BAR(true) + `<div class="wrap">
    <div class="hero"><div class="marker">${idx + 1}</div><div class="who">
      <div class="name">${esc((m.en + " " + m.last).toUpperCase())}</div><div class="arname">${esc(m.arFull)}${m.preparer ? " · ★ معد التقرير" : ""}</div>
      <div class="role">دورك: <b>${slideList(m)}</b> · الوقت: ${esc(m.time)}<br>${before ? `تتكلم بعد <b>${esc(before.ar)}</b>` : "<b>أنت أول واحد يتكلم</b>"} · ${after ? `وبعدك <b>${esc(after.ar)}</b>` : "<b>وأنت تختم العرض</b>"}</div>
      <div class="prog"><i id="pbar"></i></div><div class="progt" id="ptxt"></div></div></div>
    ${SR ? "" : `<div class="note warn">⚠️ التصحيح الصوتي ما يشتغل في هذا المتصفح. افتح الرابط في <b>Chrome</b> (أندرويد) أو <b>Safari</b> (آيفون). الاستماع يشتغل عادي.<button class="btn copy">📋 نسخ الرابط</button></div>`}
    <div class="tabs"><button class="tab on" data-p="lines">جملي <span class="c">${lines.length}</span></button><button class="tab" data-p="summary">أسئلة المشروع <span class="c">${SUMMARY_ITEMS.length}</span></button><button class="tab" data-p="words">الكلمات</button><button class="tab" data-p="qa">الأسئلة</button></div>
    <div class="panel" data-p="lines">
      <div class="hint">اضغط <b>▶ اسمع</b> وتابع الكلمة المضيئة، بعدين اضغط <b>🎤 قلها</b> وكرر الجملة. اضغط أي كلمة عشان تسمعها لحالها.</div>
      ${groups.map(g => `<h2 class="sec">الشريحة ${g.n} · ${esc(g.ar)} <span class="en">${esc(g.title)}</span></h2>` + g.items.map(it => cardHTML(it, k++)).join("")).join("")}
    </div>
    <div class="panel" data-p="summary" hidden>
      <div class="note">الأستاذ ممكن يسأل <b>أي عضو</b> عن المشروع كله. هذي ٥ أسئلة متوقعة، وتحت كل سؤال جوابه. اسمع السؤال، بعدين تدرّب تقول الجواب.</div>
      ${SUMMARY_ITEMS.map((it, i) => cardHTML(it, i)).join("")}
    </div>
    <div class="panel" data-p="words" hidden>
      <div class="hint">الكلمات الصعبة في جزئك. اضغط الكلمة عشان تسمعها، وتحتها طريقة نطقها بالعربي ومعناها.</div>
      <div class="wgrid">${words.map(([w, say, mean]) => `<button class="wcard" data-w="${esc(w)}"><div class="en">${esc(w)}</div><div class="say">${esc(say)}</div><div class="m">${esc(mean)}</div><div class="spk">🔊 اسمع</div></button>`).join("")}</div>
      <div class="hint" style="margin-top:10px">پ = P · ڤ = V · چ = CH</div>
    </div>
    <div class="panel" data-p="qa" hidden>
      <div class="hint">أسئلة متوقعة من الأستاذ بعد العرض. اسمع السؤال، وتدرّب على الجواب.</div>
      ${qa.map((it, i) => cardHTML(it, i)).join("")}
    </div>
    <div class="foot">عرض مجموعة ${esc(DATA.members.find(x => x.preparer).arFull)} · ${esc(DATA.teacher.ar)}</div>
  </div>`;
  refreshProgress();
  lines.concat(SUMMARY_ITEMS).forEach(it => getAudio(it.id));
}
function refreshProgress() {
  const m = memberOf(location.hash.replace("#", "").split("/")[0]); if (!m) return;
  const p = progressOf(m), bar = document.getElementById("pbar"), txt = document.getElementById("ptxt");
  if (bar) bar.style.width = (p.total ? Math.round(100 * p.done / p.total) : 0) + "%";
  if (txt) txt.textContent = p.done >= p.total ? `أتقنت كل الجمل 🏆 ${p.done} من ${p.total}` : `أتقنت ${p.done} من ${p.total} جملة (٧٥٪ أو أكثر = أتقنتها)`;
}
function render() {
  stopAudio(); stopRec();
  const id = location.hash.replace("#", "").split("/")[0];
  const m = memberOf(id);
  window.scrollTo(0, 0);
  if (m) renderMember(m); else renderHome();
}
window.addEventListener("hashchange", render);

// ---------- events ----------
function itemOf(el) { const c = el.closest(".card"); return c ? ITEMS[c.dataset.id] : null; }
function karaoke(el) {
  const spans = el.querySelectorAll(".line .w"), item = itemOf(el), wt = wordTimes(item);
  return t => {
    spans.forEach((s, i) => { const on = t >= 0 && wt[i][0] != null && t >= wt[i][0] - 30 && t < (wt[i + 1] && wt[i + 1][0] != null ? wt[i + 1][0] - 30 : wt[i][1] + 150); s.classList.toggle("now", on); });
  };
}
app.addEventListener("click", e => {
  setTimeout(unlockAll, 0);
  const t = e.target.closest("button, .w");
  if (!t) return;
  const card = t.closest(".card"), item = card ? ITEMS[card.dataset.id] : null;
  if (t.classList.contains("tab")) {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.p !== t.dataset.p);
    stopAudio(); stopRec(); return;
  }
  if (t.classList.contains("copy")) { navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => toast("نسخت الرابط ✅ الصقه في Chrome أو Safari")).catch(() => toast(location.href)); return; }
  if (t.classList.contains("wcard")) {
    const w = t.dataset.w, k = Scoring.key(w.split(" ")[0]);
    for (const it of Object.values(ITEMS)) { // play the word from a sentence that contains it (same voice)
      const tk = Scoring.tokenize(it.en), i = tk.findIndex(x => Scoring.keysOf(x)[0] === k);
      if (i >= 0 && TIMINGS[it.id] && TIMINGS[it.id].length) { const wt = wordTimes(it), n = w.split(" ").length, e2 = wt[Math.min(i + n - 1, wt.length - 1)][1]; playWord(w.split(" ").map(x => Scoring.key(x)).join("-"), () => playRange(it, wt[i][0] - 60, e2 + 80, 0.85)); return; }
    }
    playWord(w.split(" ").map(x => Scoring.key(x)).join("-"), () => speak(w, 0.8)); return;
  }
  if (!item) return;
  if (t.classList.contains("w")) {
    const i = Array.from(card.querySelectorAll(".line .w")).indexOf(t), wt = wordTimes(item);
    const ks = Scoring.keysOf(t.textContent);
    const slice = () => { if (wt[i][0] != null) playRange(item, wt[i][0] - 60, wt[i][1] + 120, 0.85, k => t.classList.toggle("now", k >= 0)); else speak(t.textContent, 0.8); };
    if (ks.length === 1) { t.classList.add("now"); setTimeout(() => t.classList.remove("now"), 900); playWord(ks[0], slice); } else slice();
    return;
  }
  if (t.classList.contains("qplay")) { stopAudio(); playRange({ id: t.dataset.q, en: item.q }, 0, null, 1); return; }
  if (t.classList.contains("play")) { playRange(item, 0, null, 1, karaoke(card)); return; }
  if (t.classList.contains("slow")) { playRange(item, 0, null, 0.7, karaoke(card)); return; }
  if (t.classList.contains("mic")) { startRec(item, card); return; }
  if (t.classList.contains("chip")) { const i = +t.dataset.i, wt = wordTimes(item), ks = Scoring.keysOf(Scoring.tokenize(item.en)[i]); const slice = () => playRange(item, wt[i][0] - 60, wt[i][1] + 120, 0.75); if (ks.length === 1) playWord(ks[0], slice); else slice(); return; }
  if (t.classList.contains("again")) { card.querySelectorAll(".line .w").forEach(s => s.classList.remove("ok", "close", "miss")); card.querySelector(".res").hidden = true; card.querySelector(".live").textContent = ""; startRec(item, card); return; }
  if (t.classList.contains("next")) {
    if (t.dataset.slow) { playRange(item, 0, null, 0.7, karaoke(card)); return; }
    let n = card.nextElementSibling; while (n && !n.classList.contains("card")) n = n.nextElementSibling;
    if (!n) { toast("خلصت هذا القسم 🏆 جرّب القسم اللي بعده من فوق"); return; }
    document.querySelectorAll(".card.focus").forEach(c => c.classList.remove("focus")); n.classList.add("focus");
    n.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => n.classList.remove("focus"), 2500);
    return;
  }
});
document.addEventListener("touchend", unlockAll, { once: true, passive: true });
render();
</script>
